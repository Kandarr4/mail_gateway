name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Продукт работает службой Windows, и проверять его честно на Windows:
    # так заодно ставится pywin32, который на Linux отсекается маркером.
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install
        # Не requirements-dev.txt: там PySide6 и PyInstaller, которые нужны
        # значку в трее и сборке поставки, но ни одному тесту.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx ruff

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest
